[workspace]
name = "golf-posture"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26.0,<2"
pandas = ">=2.3.0,<3"
scipy = ">=1.16.0,<2"
opencv = ">=4.12.0,<5"
pytorch = "*"
torchvision = "*"

[pypi-dependencies]
mediapipe = "==0.10.21"
ultralytics = ">=8.4.60, <9"

[target.linux-64.dependencies]
libgles = ">=1.7.0,<2"
libegl = ">=1.7.0,<2"
